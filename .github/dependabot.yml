# Dependabot keeps dependencies patched by opening PRs for updates, with a
# priority on security fixes. Covers all three ecosystems this repo uses.
# Docs: https://docs.github.com/code-security/dependabot
version: 2
updates:
  # Python backend (runtime + dev pins).
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Batch routine version bumps into one PR to cut noise; security updates
      # still come through on their own.
      python-deps:
        patterns: ["*"]

  # React/Vite frontend.
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # A TypeScript MAJOR cannot ride the weekly group: typescript-eslint pins
    # a peer range one major behind the compiler (8.66 requires <6.1.0), so
    # grouping the two made PR #35 uninstallable (ERESOLVE) as proposed.
    # Minors/patches keep flowing; a major must arrive alone, when the lint
    # toolchain actually supports it, as its own deliberate PR.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      npm-deps:
        patterns: ["*"]

  # The GitHub Actions used in ci.yml (checkout, setup-python, setup-node).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
