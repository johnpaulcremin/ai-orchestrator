name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    name: Backend (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests evals

      - name: Format check (ruff)
        run: ruff format --check app tests evals

      - name: Type check (mypy)
        run: mypy

      - name: Test (pytest)
        # Tests stub the OpenAI client and set a dummy key, so no secret is needed.
        # --cov-report=term-missing prints per-file % + uncovered line ranges
        # right in the job log; the fail-under gate itself is in pyproject.toml's
        # [tool.coverage.report] (coverage.py auto-discovers it, no extra flag
        # needed here) — this step fails the job if overall coverage regresses.
        run: pytest tests -q --cov=app --cov-report=term-missing

  security:
    name: Security (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: pip install pip-audit==2.7.3

      # Audit the runtime dependency set for known CVEs. A red here means a
      # vulnerable dependency, not a code bug — kept a separate job so the
      # signal is unambiguous.
      - name: Audit dependencies (pip-audit)
        run: pip-audit -r requirements.txt

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (eslint)
        run: npm run lint

      - name: Test (vitest)
        run: npm run test:coverage

      - name: Build (tsc + vite)
        run: npm run build

  e2e:
    name: E2E (Playwright smoke)
    runs-on: ubuntu-latest
    # The slowest job (browser download + full app boot) — only worth
    # running once the cheap unit-test jobs have already confirmed the
    # backend and frontend each work in isolation.
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci

      - name: Type check (tsc)
        working-directory: e2e
        run: npm run typecheck

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke test
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
