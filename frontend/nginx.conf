server {
    listen 80;
    server_name _;

    # Baseline security headers, every response from this server (API
    # proxy included — see the `location /api/` block below, which doesn't
    # override these). The tightest CSP that doesn't break this app's
    # actual runtime behavior, with each allowance beyond 'self' called out:
    #   - img-src ... data:   -- attachments and model-generated images are
    #     rendered as data: URIs (see MessageList.tsx), never fetched from
    #     an external host.
    #   - media-src ... blob: -- the $ 🔊 voice-output button plays
    #     POST /v1/speak's audio via `new Audio(blobUrl)` (see App.tsx),
    #     a client-side object URL, not a remote fetch.
    #   - connect-src 'self'  -- every API call goes through this same
    #     origin's /api/ proxy; no third-party endpoint is ever called
    #     directly from the browser.
    #   - frame-ancestors 'none' -- redundant with X-Frame-Options: DENY
    #     below for modern browsers, kept for older ones that only honor
    #     X-Frame-Options.
    # No allowance was needed for script-src/style-src/font-src beyond
    # 'self': Vite bundles everything same-origin, no CDN, no inline
    # <script>/<style> tags, and React's inline `style` prop sets DOM
    # properties directly rather than parsing an HTML style="" attribute,
    # so it isn't restricted by CSP's style-src the way a literal
    # style="..." attribute would be.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; media-src 'self' blob:; connect-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Proxy API calls to the backend. The trailing slash on proxy_pass strips the
    # /api prefix, so /api/v1/... reaches the backend as /v1/... (matching the
    # Vite dev proxy).
    location /api/ {
        # nginx's 1m default silently 413s the app's own accepted payloads:
        # up to 4 images (12M base64 chars each) + 4 documents (20M chars
        # each) on a single /v1/ask (see app/schemas.py's _MAX_INPUT_*_CHARS),
        # or up to 34M chars of audio on /v1/transcribe. 150m covers the
        # worst case with headroom; the Vite dev proxy has no such limit, so
        # this only ever bit the Docker deploy path.
        client_max_body_size 150m;

        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Stream Server-Sent Events without buffering.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        # /v1/compare dispatches up to 4 models (_MAX_COMPARE_MODELS)
        # sequentially, and each one can retry through up to 3 fallback
        # candidates before giving up (see _fallback_models) — every attempt
        # can take the full OPENAI_TIMEOUT_SECONDS (120s default). Worst case:
        # 4 * 4 * 120s = 1920s. 300s let nginx 504 a request the backend was
        # still legitimately working on. If OPENAI_TIMEOUT_SECONDS is raised,
        # raise this to match (models * 4 * OPENAI_TIMEOUT_SECONDS).
        proxy_read_timeout 2000s;
    }

    # Single-page app: serve static files, fall back to index.html.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
