[mypy]
# Static type checking for the shipped backend. Pragmatic, not --strict: the
# goal is catching real bugs (wrong attribute on a union, bad call signature)
# without a wall of "annotate everything" churn. Run: `mypy` (config picks app).
python_version = 3.11
files = app
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
check_untyped_defs = True

# pytesseract ships no type stubs/py.typed marker either.
[mypy-pytesseract.*]
ignore_missing_imports = True

# sympy ships no type stubs/py.typed marker either.
[mypy-sympy.*]
ignore_missing_imports = True

# openpyxl ships no type stubs/py.typed marker either.
[mypy-openpyxl.*]
ignore_missing_imports = True
