[tool.pytest.ini_options]
# Without this, `pytest` (as CI invokes it) can't import `app` from tests/
# conftest.py: with no tests/__init__.py, pytest's default "prepend" import
# mode puts tests/ itself on sys.path, not the repo root. `python -m pytest`
# masks this locally because `-m` always prepends the CWD first — CI runs
# bare `pytest`, which doesn't get that for free.
pythonpath = ["."]
filterwarnings = [
    # Many tests deliberately use short throwaway JWT secrets (e.g. "s3cret")
    # purely to exercise signing/verification logic, not to model a real
    # deployment's JWT_SECRET — silence PyJWT's real-world-security warning
    # here rather than padding every test fixture's secret to 32+ bytes.
    "ignore:.*HMAC key.*below the minimum recommended length.*:jwt.warnings.InsecureKeyLengthWarning",
]
