[tool.pytest.ini_options]
# Without this, `pytest` (as CI invokes it) can't import `app` from tests/
# conftest.py: with no tests/__init__.py, pytest's default "prepend" import
# mode puts tests/ itself on sys.path, not the repo root. `python -m pytest`
# masks this locally because `-m` always prepends the CWD first — CI runs
# bare `pytest`, which doesn't get that for free.
pythonpath = ["."]
filterwarnings = [
    # Many tests deliberately use short throwaway JWT secrets (e.g. "s3cret")
    # purely to exercise signing/verification logic, not to model a real
    # deployment's JWT_SECRET — silence PyJWT's real-world-security warning
    # here rather than padding every test fixture's secret to 32+ bytes.
    "ignore:.*HMAC key.*below the minimum recommended length.*:jwt.warnings.InsecureKeyLengthWarning",
]

[tool.ruff.lint]
# Pin the enforced rule set explicitly rather than relying on ruff's
# no-config default. That default is NOT stable across versions: ruff
# 0.16.0 (vs. the 0.15.12 this repo has run under until now) expanded its
# implicit default from pyflakes+pycodestyle (E, F) to nearly every rule
# category ruff ships (BLE, TRY, I, PLR, UP, RUF, S, ISC, FURB, FLY, SIM,
# PYI, PIE, B, ...) -- surfaced by a routine Dependabot ruff bump as ~170
# new violations across ~20 files with zero code changes of their own
# (found investigating the resulting CI failure). Pinning it explicitly
# below keeps today's actual enforced surface -- the one this codebase has been
# written and reviewed against -- independent of any future ruff version's
# choice of "default". `E4, E7, E9, F` is ruff's own documented historical
# default rule set (pycodestyle's import/statement/runtime-error subsets +
# pyflakes) -- deliberately narrower than plain "E", which also includes
# E501 (line-too-long); this repo relies on `ruff format` for line length
# instead, so a bare "E" select regresses ~97 pre-existing long lines.
# Broadening this set (e.g. to add BLE001's "don't catch blind Exception")
# is a deliberate call to make later, not something a patch/minor version
# bump should decide silently.
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
# Measured baseline (2026-07-29): 94% overall. Set 4 points below that as a
# real ratchet with headroom — low enough that one new, lightly-tested file
# doesn't fail the build outright, high enough to actually catch a real
# regression (a big new module landing with near-zero tests). Picked from
# real data per the reasoning this comment used to describe waiting for;
# `coverage.py` auto-discovers this table from pyproject.toml, so plain
# `pytest --cov=app` (see .github/workflows/ci.yml) enforces it with no
# extra flag. Raise this over time as coverage naturally climbs -- it should
# only ever ratchet up, never down for convenience.
fail_under = 90
